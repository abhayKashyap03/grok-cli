[package]
name = "grok-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# The framework to build CLI commands
clap = { version = "4.4", features = ["derive", "env"] }

# The async runtime (the engine that lets us do multiple things at once)
tokio = { version = "1.50.0", features = ["full"] }

# The TUI library (the "React" of the terminal)
ratatui = "0.30.0"

# The terminal backend (handles raw mode, keys, and mouse)
crossterm = { version = "0.29.0", features = ["event-stream"] }

# For handling JSON (essential for LLM APIs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For making API calls
reqwest = { version = "0.13.2", features = ["json", "stream"] }

# Environment vars
dotenvy = "0.15"

anyhow = "1.0.102"
thiserror = "2.0.20"
tokio-util = "0.7.19"
futures = "0.3.34"
async-trait = "0.1.92"
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13.1"
similar = "3.2.0"
dirs = "7.0.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
shell-words = "1.1.1"
unicode-width = "0.2.2"
pulldown-cmark = "0.13.4"
toml = "1.1.5"
bytes = "1.12.1"
textwrap = "0.16.2"
futures-util = "0.3.34"
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately NOT panic = "abort". Aborting skips unwinding, so no Drop impl
# runs — including the `kill_on_drop` that reaps background shells and MCP
# server processes. A panic would leave those orphaned. The binary is slightly
# larger; orphaned child processes are worse.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1
